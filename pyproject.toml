[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-agent"
version = "0.2.0"
description = "A small plan-and-execute agent with web search and file creation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.54.0,<3",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
goal-agent = "goal_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goal_agent = ["static/*.html", "evaluation_cases.json"]
